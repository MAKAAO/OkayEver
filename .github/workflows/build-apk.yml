name: Build OkayEver APK
on:
  push:
    branches: [main]
    paths:
      - "OkayEver_Android_WebApp_Source.zip"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out app project
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4.4.2
        with:
          gradle-version: "8.9"
      - name: Unpack project
        run: unzip -q OkayEver_Android_WebApp_Source.zip
      - name: Build installable debug APK
        run: gradle -p okayever-android --no-daemon :app:assembleDebug
      - name: Save APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OkayEver-APK
          path: okayever-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
